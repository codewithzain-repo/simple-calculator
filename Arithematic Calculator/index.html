<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithematic Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="calculator">

        <div class="calculator-box">

            <h1>Arithematic Calculator</h1>
            <p> <b>An Arithmetic Calculator</b> is a tool that performs basic math like addition, subtraction, multiplication, and division. In programming, it's used to practice handling user input, event listeners, and math logic.</p>

            <input type="text" name="result" id="result" readonly placeholder="0">

            <label for="num1">Enter First Number</label>
            <input type="number" id="num1">

            <div class="operators">
                <button id="plus">+</button>
                <button id="minus">-</button>
                <button id="multiply">*</button>
                <button id="divide">/</button>
            </div>

            <label for="num2">Enter Second Number</label>
            <input type="number" id="num2">

            <button id="calculate">Calculate</button>
        
        </div>

    </section>
    <script src="script.js"></script>
</body>
</html>
